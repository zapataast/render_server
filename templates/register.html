{% extends "base.html" %}
{% block title %}Бүртгүүлэх{% endblock %}
{% block body %}
<div class="center"><div class="card auth">
  <h1>Бүртгүүлэх</h1><p>Эхлээд утас, nickname, password хангалттай.</p>
  {% with messages=get_flashed_messages(with_categories=true) %}
    {% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Утас</label><div class="phone"><span>+976</span><input name="phone" value="{{phone or ''}}" maxlength="8" required></div>
    <label>Nickname</label><input name="nickname" value="{{nickname or ''}}" maxlength="50" required>
    <label>Нууц үг</label><input type="password" name="password" minlength="6" required>
    <label>Нууц үг давтах</label><input type="password" name="confirm_password" minlength="6" required>
    <button>Бүртгэл үүсгэх</button>
  </form>
  <p class="foot"><a href="{{url_for('login')}}">Нэвтрэх</a></p>
</div></div>
{% endblock %}
