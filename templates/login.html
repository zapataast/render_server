<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Нэвтрэх</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="
        min-h-screen
        bg-slate-50
        flex
        items-center
        justify-center
        px-4
    "
>

<div
    class="
        w-full
        max-w-md
        bg-white
        rounded-3xl
        shadow-xl
        shadow-slate-200/60
        border
        border-slate-100
        p-8
    "
>

    <div class="text-center mb-8">

        <div
            class="
                mx-auto
                w-14
                h-14
                rounded-2xl
                bg-indigo-600
                flex
                items-center
                justify-center
                text-white
                text-2xl
                font-bold
                mb-4
            "
        >
            A
        </div>

        <h1
            class="
                text-2xl
                font-bold
                text-slate-900
            "
        >
            Нэвтрэх
        </h1>

        <p
            class="
                mt-2
                text-sm
                text-slate-500
            "
        >
            Утасны дугаараа оруулна уу
        </p>

    </div>


    {% if error %}

    <div
        class="
            mb-5
            rounded-xl
            bg-red-50
            border
            border-red-100
            px-4
            py-3
            text-sm
            text-red-600
        "
    >
        {{ error }}
    </div>

    {% endif %}


    <form
        method="POST"
        action="/auth/start"
        class="space-y-5"
    >

        <div>

            <label
                class="
                    block
                    text-sm
                    font-semibold
                    text-slate-700
                    mb-2
                "
            >
                Утасны дугаар
            </label>

            <div class="relative">

                <span
                    class="
                        absolute
                        left-4
                        top-1/2
                        -translate-y-1/2
                        text-slate-400
                    "
                >
                    +976
                </span>

                <input
                    type="tel"
                    name="phone"
                    maxlength="8"
                    inputmode="numeric"
                    autocomplete="tel"

                    value="{{ phone or '' }}"

                    placeholder="88******"

                    required

                    class="
                        w-full
                        rounded-xl
                        border
                        border-slate-200
                        bg-slate-50
                        py-3.5
                        pl-16
                        pr-4
                        text-slate-900
                        outline-none

                        focus:border-indigo-500
                        focus:ring-4
                        focus:ring-indigo-100

                        transition
                    "
                >

            </div>

        </div>


        <button
            type="submit"

            class="
                w-full
                rounded-xl
                bg-indigo-600
                text-white
                py-3.5
                font-semibold

                hover:bg-indigo-700
                active:scale-[0.98]

                transition
            "
        >
            Үргэлжлүүлэх
        </button>

    </form>


    <p
        class="
            text-xs
            text-center
            text-slate-400
            mt-6
        "
    >
        Нууц үг шаардлагагүй.
        Утасны дугаараар баталгаажуулна.
    </p>

</div>

</body>
</html>
