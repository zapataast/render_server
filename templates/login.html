{% extends "base.html" %}
{% block title %}Нэвтрэх{% endblock %}
{% block body %}
<div class="center"><div class="card auth">
  <h1>Нэвтрэх</h1><p>Утасны дугаараараа нэвтэрнэ үү</p>
  {% with messages=get_flashed_messages(with_categories=true) %}
    {% for c,m in messages %}<div class="alert {{c}}">{{m}}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Утас</label><div class="phone"><span>+976</span><input name="phone" value="{{phone or ''}}" maxlength="8" required></div>
    <label>Нууц үг</label><input type="password" name="password" required>
    <button>Нэвтрэх</button>
  </form>
  <p class="foot">Бүртгэлгүй юу? <a href="{{url_for('register')}}">Бүртгүүлэх</a></p>
</div></div>
{% endblock %}
