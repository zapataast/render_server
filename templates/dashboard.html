{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block body %}
<div class="dashboard">

    <header class="topbar">

        <div class="topbar-brand">
            <div class="small-logo">R</div>
            <strong>Render App</strong>
        </div>

        <div class="user-menu">
            <span>{{ user.nickname }}</span>
            <a href="{{ url_for('logout') }}">
                Гарах
            </a>
        </div>

    </header>

    <main class="dashboard-content">

        <div class="welcome-card">

            <h1>
                Тавтай морил, {{ user.nickname }} 👋
            </h1>

            <p>
                Та системд амжилттай нэвтэрлээ.
            </p>

            <div class="profile-list">

                <div class="info-row">
                    <span>Nickname</span>
                    <strong>{{ user.nickname }}</strong>
                </div>

                <div class="info-row">
                    <span>Утас</span>
                    <strong>+976 {{ user.phone }}</strong>
                </div>

            </div>

        </div>

    </main>

</div>
{% endblock %}
