<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link
        rel="stylesheet"
        href="https://cdn.plyr.io/3.7.8/plyr.css"
    />
    <title>Anime Player</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f6fa;
            font-family: Arial, sans-serif;
            color: #1f2937;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 600;
        }

        .player-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.07);
        }

        .player-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #111827;
            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
        }

        h1 {
            margin-top: 24px;
            margin-bottom: 8px;
        }

        .meta {
            color: #6b7280;
        }
        .plyr {
            border-radius: 16px;
            overflow: hidden;
        }

        .plyr--video {
            background: #000;
        }

        .plyr__control--overlaid {
            width: 70px;
            height: 70px;
        }
    </style>
</head>

<body>

<div class="page">

    <a
        href="/"
        class="back"
    >
        ← Буцах
    </a>

    <div class="player-card">

        <div class="player-box">
            <video
                controls
                controlsList="nodownload noremoteplayback"
                disablePictureInPicture
                playsinline
                preload="metadata"
                src="{{ url_for('stream_video', video_id=video.id) }}"
                oncontextmenu="return false;"
            >
            </video>
            </video>
        </div>

        <h1>
            Video #{{ video_id }}
        </h1>

        <div class="meta">
            Player бэлдэж байна...
        </div>

    </div>

</div>

</body>

<link
    rel="stylesheet"
    href="https://cdn.plyr.io/3.7.8/plyr.css"
/>


<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<script>
    const player = new Plyr('#player', {
        controls: [
            'play-large',
            'rewind',
            'play',
            'fast-forward',
            'progress',
            'current-time',
            'duration',
            'mute',
            'volume',
            'settings',
            'fullscreen'
        ],

        settings: [
            'speed'
        ]
    });
</script>
</html>
