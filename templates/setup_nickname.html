<!DOCTYPE html>
<html lang="mn">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nickname сонгох</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>


<body
    class="
        min-h-screen
        bg-slate-50
        flex
        items-center
        justify-center
        px-4
    "
>


<div
    class="
        w-full
        max-w-md
        bg-white
        rounded-3xl
        border
        border-slate-100
        shadow-xl
        shadow-slate-200/60
        p-8
    "
>


    <!-- ICON -->

    <div
        class="
            mx-auto
            w-16
            h-16
            rounded-full
            bg-indigo-50
            flex
            items-center
            justify-center
            mb-5
        "
    >

        <svg
            class="
                w-8
                h-8
                text-indigo-600
            "
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
        >

            <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="
                    M5.121 17.804
                    A9.003 9.003 0 0112 15
                    c2.13 0 4.087.74 5.629 1.977
                    M15 11
                    a3 3 0 11-6 0
                    3 3 0 016 0z
                "
            />

        </svg>

    </div>



    <!-- TITLE -->

    <div class="text-center">

        <h1
            class="
                text-2xl
                font-bold
                text-slate-900
            "
        >
            Тавтай морил
        </h1>


        <p
            class="
                mt-2
                text-sm
                text-slate-500
            "
        >
            Бүртгэлээ дуусгахын тулд nickname сонгоно уу.
        </p>


        <div
            class="
                mt-3
                inline-flex
                items-center
                rounded-full
                bg-emerald-50
                px-3
                py-1.5
                text-xs
                font-medium
                text-emerald-700
            "
        >
            ✓ {{ phone }} баталгаажсан
        </div>

    </div>



    {% if error %}

    <div
        class="
            mt-6
            rounded-xl
            bg-red-50
            border
            border-red-100
            px-4
            py-3
            text-sm
            text-red-600
        "
    >
        {{ error }}
    </div>

    {% endif %}



    <form
        method="POST"
        class="
            mt-7
            space-y-5
        "
    >


        <div>

            <label
                for="nickname"
                class="
                    block
                    text-sm
                    font-semibold
                    text-slate-700
                    mb-2
                "
            >
                Nickname
            </label>


            <input
                type="text"

                id="nickname"
                name="nickname"

                minlength="3"
                maxlength="30"

                autocomplete="nickname"

                value="{{ nickname or '' }}"

                placeholder="Жишээ: HandoSonic"

                autofocus
                required

                class="
                    w-full
                    rounded-xl
                    border
                    border-slate-200
                    bg-slate-50

                    px-4
                    py-3.5

                    text-slate-900

                    outline-none

                    focus:border-indigo-500
                    focus:ring-4
                    focus:ring-indigo-100

                    transition
                "
            >


            <p
                class="
                    mt-2
                    text-xs
                    text-slate-400
                "
            >
                3–30 тэмдэгт ашиглана.
            </p>

        </div>



        <button
            type="submit"

            class="
                w-full
                rounded-xl
                bg-indigo-600
                text-white
                py-3.5
                font-semibold

                hover:bg-indigo-700
                active:scale-[0.98]

                transition
            "
        >
            Бүртгэл үүсгэх
        </button>


    </form>


</div>


</body>
</html>
